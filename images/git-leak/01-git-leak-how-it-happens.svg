<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 724" font-family="'Segoe UI','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <defs>
    <marker id="tl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00A651"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="724" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Header -->
  <rect x="34" y="30" width="6" height="46" rx="3" fill="#00A651"/>
  <text x="52" y="54" font-size="23" font-weight="700" fill="#0f172a">.git 外洩是怎麼發生的？用開店來比喻</text>
  <text x="52" y="82" font-size="14.5" fill="#64748b">Git 會幫你存一份「整間店的完整備份」，本來只該鎖在自己的保險庫，卻不小心被放到店門口。</text>

  <!-- Timeline spine arrows -->
  <g stroke="#00A651" stroke-width="2.5">
    <line x1="76" y1="220" x2="76" y2="252" marker-end="url(#tl-arrow)"/>
    <line x1="76" y1="380" x2="76" y2="412" marker-end="url(#tl-arrow)"/>
  </g>
  <text x="104" y="242" font-size="12.5" fill="#64748b">👉 網站上線、部署到主機的時候……</text>
  <text x="104" y="402" font-size="12.5" fill="#64748b">👉 而網站的網址是「公開又固定」的……</text>

  <!-- Step 1 -->
  <rect x="34" y="98" width="772" height="118" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="76" cy="130" r="17" fill="#00A651"/>
  <text x="76" y="136" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="106" y="140" font-size="24">🗄️</text>
  <text x="146" y="132" font-size="16" font-weight="700" fill="#00693E">.git ＝ 你整間店的「完整備份」</text>
  <text x="146" y="162" font-size="13.5" fill="#475569">Git 會自動把你每一版的程式碼，連同裡面的金鑰（HashKey／HashIV）、資料庫密碼，</text>
  <text x="146" y="184" font-size="13.5" fill="#475569">全部存進一個叫 .git 的<tspan font-weight="700" fill="#0f172a">隱藏資料夾</tspan>。它就像一本記著店裡所有祕密的帳本。</text>
  <text x="146" y="206" font-size="12.5" fill="#94a3b8">＊本來只該留在你自己的電腦或後台，絕對不該讓外人看到。</text>

  <!-- Step 2 -->
  <rect x="34" y="258" width="772" height="118" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="76" cy="290" r="17" fill="#00A651"/>
  <text x="76" y="296" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="106" y="300" font-size="24">📦</text>
  <text x="146" y="292" font-size="16" font-weight="700" fill="#00693E">上線時，這份備份「跟著一起」被搬上網站</text>
  <text x="146" y="322" font-size="13.5" fill="#475569">把網站放上主機時，這個看不見的備份常常不知不覺跟著上去，</text>
  <text x="146" y="344" font-size="13.5" fill="#475569">而且被放到了<tspan font-weight="700" fill="#0f172a">任何人都連得到的公開位置</tspan>。</text>
  <text x="146" y="366" font-size="12.5" fill="#94a3b8">＊因為它是隱藏的，你在畫面上看不到它，所以根本不會發現它也一起公開了。</text>

  <!-- Step 3 -->
  <rect x="34" y="418" width="772" height="118" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <circle cx="76" cy="450" r="17" fill="#dc2626"/>
  <text x="76" y="456" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="106" y="460" font-size="24">🌐</text>
  <text x="146" y="452" font-size="16" font-weight="700" fill="#991b1b">任何人照著固定網址，就能把整份備份下載走</text>
  <text x="146" y="482" font-size="13.5" fill="#475569">網址是公開又固定的，就像門牌貼在外面。任何人<tspan font-weight="700" fill="#0f172a">不用密碼、不用破解</tspan>，</text>
  <text x="146" y="504" font-size="13.5" fill="#475569">照著網址就能把整份備份原封不動抱走。</text>
  <text x="146" y="526" font-size="12.5" fill="#b91c1c">＊結果：你的程式碼、金鑰、密碼，全都到了陌生人手上。</text>

  <!-- Insight box -->
  <rect x="34" y="560" width="772" height="134" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="52" y="590" font-size="15" font-weight="700" fill="#92400e">💡 為什麼「一個資料夾」外洩，就等於整間店都外洩？</text>
  <text x="52" y="618" font-size="13.5" fill="#78350f">因為 .git 是你專案的<tspan font-weight="700">完整備份</tspan>，不是普通資料夾——它記錄了每一個版本的所有內容。</text>
  <text x="52" y="642" font-size="13.5" fill="#78350f">連你事後刪掉的金鑰，只要<tspan font-weight="700">曾經存進去過</tspan>，都還留在裡面被撈得回來。</text>
  <text x="52" y="672" font-size="13.5" fill="#b45309">👉 所以一旦外洩，一定要「更換」所有金鑰與密碼；光是把檔案刪掉並沒有用。</text>
</svg>
