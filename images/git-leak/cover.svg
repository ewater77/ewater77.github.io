<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Segoe UI','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="12" height="630" fill="#10b981"/>

  <text x="80" y="96" font-size="20" font-weight="700" letter-spacing="3" fill="#34d399">ECPAY 資安專欄 · 給串接廠商</text>

  <text x="78" y="212" font-size="62" font-weight="800" fill="#f8fafc">別讓 HashKey／HashIV</text>
  <text x="78" y="292" font-size="62" font-weight="800" fill="#f8fafc">隨原始碼一起外流</text>

  <text x="80" y="352" font-size="27" fill="#94a3b8">.git 目錄外洩的自我檢測、修補與通報指南</text>

  <!-- terminal card -->
  <rect x="80" y="416" width="640" height="128" rx="12" fill="#0b1220" stroke="#334155"/>
  <circle cx="108" cy="446" r="6" fill="#ef4444"/><circle cx="128" cy="446" r="6" fill="#f59e0b"/><circle cx="148" cy="446" r="6" fill="#22c55e"/>
  <text x="108" y="498" font-size="22" fill="#e2e8f0" font-family="'Consolas','Menlo',monospace"><tspan fill="#22c55e">$</tspan> curl -s https://your-site<tspan fill="#f87171">/.git/HEAD</tspan></text>
  <text x="108" y="526" font-size="16" fill="#64748b" font-family="'Consolas','Menlo',monospace">ref: refs/heads/main   ← 看到這行就代表可能外洩</text>

  <!-- folder + warning motif -->
  <g transform="translate(880,150)">
    <path d="M40,60 h70 l24,28 h146 a16,16 0 0 1 16,16 v150 a16,16 0 0 1 -16,16 h-240 a16,16 0 0 1 -16,-16 v-178 a16,16 0 0 1 16,-16 z" fill="#1e3a5f" stroke="#3b82f6" stroke-width="3"/>
    <text x="160" y="192" font-size="46" font-weight="800" fill="#93c5fd" text-anchor="middle" font-family="'Consolas',monospace">.git</text>
    <g transform="translate(212,196)">
      <path d="M40,0 L80,72 L0,72 Z" fill="#dc2626" stroke="#0f172a" stroke-width="4"/>
      <rect x="36" y="26" width="8" height="26" rx="4" fill="#fff"/>
      <circle cx="40" cy="62" r="5" fill="#fff"/>
    </g>
  </g>
</svg>
